<!doctype html>
<html>
<head><meta charset="utf-8"><title>render</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script type="module">
import { loadCampaign, createRenderer } from './player.js';
import { renderSoundtrack, encodeWav } from './audio.js';

try {
const id = new URLSearchParams(location.search).get('c') || 'learning-workbench';
const canvas = document.getElementById('c');
const campaign = await loadCampaign(id, '..');
const r = createRenderer(campaign, canvas);

window.__spec = { width: campaign.spec.width, height: campaign.spec.height, fps: campaign.spec.fps, duration: campaign.spec.duration };
window.__frame = (t, quality = 0.93) => {
  r.draw(t);
  return canvas.toDataURL('image/jpeg', quality);
};
window.__audio = async () => {
  const buf = await renderSoundtrack(campaign.spec.score);
  const bytes = encodeWav(buf, campaign.spec.duration);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.__ready = true;
} catch (error) {
  window.__failed = 'campaign initialization failed';
  console.error(error);
}
</script>
</body>
</html>
